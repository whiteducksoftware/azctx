name: Copilot setup steps

on:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - go.mod
      - go.sum
      - .golangci.yml
  workflow_dispatch:

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check active Go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          # setup-go exports local; restore automatic selection for the agent.
          echo 'GOTOOLCHAIN=auto' >> "$GITHUB_ENV"
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Install golangci-lint
        shell: bash
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify contributor tools on PATH
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          golangci-lint version
