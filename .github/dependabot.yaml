version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
