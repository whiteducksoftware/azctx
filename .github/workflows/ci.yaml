name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check active Go toolchain
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check generated CLI documentation
        run: make docs-check

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --issues-exit-code=1 --config=.golangci.yml

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Test CI configuration
        run: make ci-check

      - name: Lint workflows
        run: actionlint

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: v1.31.1
          inputs: .github/workflows
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check active Go toolchain
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Test with race detector and coverage
        run: make test

      - name: End to end command suite
        run: make e2e

      - name: Publish coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check active Go toolchain
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Verify modules
        run: go mod verify

      - name: Fuzz parsers (60 seconds each)
        run: make fuzz

      - name: Test vulnerability policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_check_govulncheck.py' -v

      - name: Install govulncheck
        # Go 1.27-compatible release; v1.1.4 predates this toolchain.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan reachable vulnerabilities
        # JSON preserves scanner errors while allowing only the two #86 exceptions.
        run: |
          govulncheck -json ./... > govulncheck.json
          python3 -B .github/scripts/check_govulncheck.py < govulncheck.json

  ci-linux:
    name: ci-linux
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check active Go toolchain
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Build with Goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --skip publish,announce,archive,sbom,homebrew,chocolatey,winget --clean --config .goreleaser.yaml

  ci-windows:
    name: ci-windows
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check active Go toolchain
        shell: bash
        run: |
          go version
          go env GOTOOLCHAIN
          grep -E '^(go|toolchain) ' go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --skip publish,announce,archive,sbom,homebrew,chocolatey,winget --clean --config .goreleaser-windows.yaml
