version: "2"

run:
  tests: true
  allow-parallel-runners: true
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - funlen
    - goconst
    - gocyclo
    - gocritic
    - godox
    - gosec
    - goheader
    - govet
    - misspell
    - nilerr
    - nolintlint
    - revive
    - staticcheck
    - tparallel
    - tagliatelle
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    dupl:
      threshold: 100
    errorlint:
      asserts: true
    funlen:
      lines: -1
      statements: 50
      ignore-comments: true
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
        - FIX
        - NOTE
        - OPTIMIZE
        - HACK
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    staticcheck:
      # v2 merges gosimple and stylecheck; keep only the existing staticcheck checks.
      checks:
        - SA*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
    goimports:
      local-prefixes:
        - github.com/whiteducksoftware/azctx
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
