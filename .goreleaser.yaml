version: 2
project_name: azctx

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    ldflags:
      - -s -w
      - -X github.com/whiteducksoftware/azctx/internal/version.Version={{.Version}}
      - -X github.com/whiteducksoftware/azctx/internal/version.BuildDate={{.CommitDate}}
      - -X github.com/whiteducksoftware/azctx/internal/version.Commit={{.FullCommit}}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^.github:"
      - "^.vscode:"

sboms:
  - id: archive
    artifacts: archive
    cmd: syft
  - id: source
    artifacts: source
    cmd: syft

archives:
  - formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_Darwin_Linux_checksums.txt"

brews:
  - name: azctx
    repository:
      owner: whiteducksoftware
      name: homebrew-tap
      branch: main
      token: "{{ .Env.AUTH_GITHUB }}"
    # Azure CLI is now a cask; Homebrew formulae cannot depend on casks.
    caveats: |
      azctx requires Azure CLI (az) to be installed and available on PATH.
      On macOS, install it with:
        brew install --cask azure-cli
      For other platforms, see:
        https://learn.microsoft.com/cli/azure/install-azure-cli
    url_template: "https://github.com/whiteducksoftware/azctx/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: "{{ .Env.GITHUB_ACTOR }}"
      email: "{{ .Env.GITHUB_ACTOR_ID }}+{{ .Env.GITHUB_ACTOR }}@users.noreply.github.com"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/whiteducksoftware/azctx"
    description: "Faster switching between Azure Subscriptions in your Azure CLI"
    license: "MIT"
    install: |
      bin.install "azctx"
