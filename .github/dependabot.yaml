version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
