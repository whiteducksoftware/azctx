version: 2

release:
  prerelease: auto
  make_latest: "{{ .Env.RELEASE_MAKE_LATEST }}"

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    ldflags:
      - -s -w
      - -X github.com/whiteducksoftware/azctx/internal/version.Version={{.Version}}
      - -X github.com/whiteducksoftware/azctx/internal/version.BuildDate={{.CommitDate}}
      - -X github.com/whiteducksoftware/azctx/internal/version.Commit={{.FullCommit}}
  - id: macos
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/whiteducksoftware/azctx/internal/version.Version={{.Version}}
      - -X github.com/whiteducksoftware/azctx/internal/version.BuildDate={{.CommitDate}}
      - -X github.com/whiteducksoftware/azctx/internal/version.Commit={{.FullCommit}}

changelog:
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^[[:alnum:]_]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\([^)]*\))?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\([^)]*\))?:'
      order: 4
    - title: Documentation
      regexp: '^docs(\([^)]*\))?:'
      order: 5
    - title: Tests
      regexp: '^test(\([^)]*\))?:'
      order: 6
    - title: Build
      regexp: '^build(\([^)]*\))?:'
      order: 7
    - title: CI
      regexp: '^ci(\([^)]*\))?:'
      order: 8
    - title: Chores
      regexp: '^chore(\([^)]*\))?:'
      order: 9
    - title: Other
      order: 10

sboms:
  - id: archive
    artifacts: archive
    cmd: syft
  - id: source
    artifacts: source
    cmd: syft

archives:
  - id: linux
    ids: [linux]
    formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: macos
    ids: [macos]
    formats: [ 'tar.gz' ]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_Darwin_Linux_checksums.txt"

homebrew_casks:
  - name: azctx
    ids: [macos]
    binaries: [azctx]
    skip_upload: auto
    repository:
      owner: whiteducksoftware
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    dependencies:
      - formula: azure-cli
    url:
      template: "https://github.com/whiteducksoftware/azctx/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: "{{ .Env.GITHUB_ACTOR }}"
      email: "{{ .Env.GITHUB_ACTOR_ID }}+{{ .Env.GITHUB_ACTOR }}@users.noreply.github.com"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/whiteducksoftware/azctx"
    description: "Switch Azure CLI subscriptions"
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/azctx"]
      end
